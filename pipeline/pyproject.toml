[project]
name = "dli"
version = "0.1.0"
description = "Dubai Location Intelligence: data pipeline"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.1",
    "polars>=1.0",
    "pyarrow>=17",
    "geopandas>=1.0",
    "shapely>=2.0",
    "pyproj>=3.6",
    "rapidfuzz>=3.9",
    "h3>=4.0",
    "osmium>=4.0",
    "pandera[polars]>=0.20",
    "httpx>=0.27",
    "typer>=0.12",
    "anthropic>=0.40",
    "python-dateutil>=2.9.0.post0",
]

[project.scripts]
dli = "dli.cli:app"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dli"]

[tool.ruff]
line-length = 100
target-version = "py312"
